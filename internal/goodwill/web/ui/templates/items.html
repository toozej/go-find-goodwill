{{template "base.html" .}}

{{define "content"}}
<div class="space-y-8">
    <div class="flex items-center justify-between">
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Item Management</h1>
    </div>

    <!-- Filter Controls -->
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-6">Filters</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="form-group space-y-2">
                <label for="status-filter" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Status</label>
                <select id="status-filter" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                    <option value="">All Statuses</option>
                    <option value="active">Active</option>
                    <option value="ended">Ended</option>
                    <option value="won">Won</option>
                </select>
            </div>

            <div class="form-group space-y-2">
                <label for="category-filter" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Category</label>
                <input type="text" id="category-filter" placeholder="Filter by category" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white placeholder-slate-400">
            </div>

            <div class="form-group space-y-2">
                <label for="price-range" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Price Range</label>
                <div class="flex items-center space-x-3">
                    <input type="number" placeholder="Min" class="w-1/2 px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white placeholder-slate-400">
                    <span class="text-slate-400">-</span>
                    <input type="number" placeholder="Max" class="w-1/2 px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white placeholder-slate-400">
                </div>
            </div>
        </div>

        <div class="flex justify-end mt-6 space-x-3">
            <button id="reset-filters" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Reset</button>
            <button id="apply-filters" class="px-5 py-2.5 rounded-xl text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 dark:hover:bg-blue-500 transition-colors shadow-sm">Apply Filters</button>
        </div>
    </div>

    <!-- Items List -->
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-6">Items</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
                <thead>
                    <tr>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50 rounded-tl-lg">Title</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50">Price</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50">Ends At</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50">Status</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50 rounded-tr-lg">Actions</th>
                    </tr>
                </thead>
                <tbody id="items-table" class="divide-y divide-slate-200 dark:divide-slate-700">
                    <tr>
                        <td colspan="5" class="text-center p-6 text-slate-500 dark:text-slate-400">Loading items...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const api = new GoodwillAPI();
    const itemsTable = document.getElementById('items-table');
    const applyFiltersBtn = document.getElementById('apply-filters');
    const resetFiltersBtn = document.getElementById('reset-filters');

    let currentItems = [];

    // Load items
    async function loadItems(filters = {}) {
        try {
            const response = await api.getItems(filters);
            currentItems = response.items || [];
            renderItemsTable();
        } catch (error) {
            console.error('Failed to load items:', error);
            itemsTable.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-danger">Failed to load items</td></tr>';
        }
    }

    // Render items table
    function renderItemsTable() {
        if (currentItems.length === 0) {
            itemsTable.innerHTML = '<tr><td colspan="5" class="text-center p-4">No items found</td></tr>';
            return;
        }

        itemsTable.innerHTML = '';
        currentItems.forEach(item => {
            const row = document.createElement('tr');
            row.className = 'hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors';

            row.innerHTML = `
                <td class="px-4 py-3 whitespace-nowrap">
                    <a href="/items/${item.id}" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 hover:underline font-medium">${item.title}</a>
                    <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">${item.category}</div>
                </td>
                <td class="px-4 py-3 whitespace-nowrap">
                    <div class="font-medium text-slate-900 dark:text-white">$${item.current_price.toFixed(2)}</div>
                    ${item.buy_now_price ? `<div class="text-xs text-slate-500 dark:text-slate-400 mt-1">Buy Now: $${item.buy_now_price.toFixed(2)}</div>` : ''}
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">${item.ends_at || 'N/A'}</td>
                <td class="px-4 py-3 whitespace-nowrap">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${item.status === 'active' ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400 border border-green-200 dark:border-green-800' : 'bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-400 border border-slate-200 dark:border-slate-700'}">
                        ${item.status}
                    </span>
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-sm">
                    <button class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-medium view-item" data-id="${item.id}">View details</button>
                </td>
            `;

            itemsTable.appendChild(row);
        });
    }

    // Apply filters
    function applyFilters() {
        const filters = {
            status: document.getElementById('status-filter').value,
            category: document.getElementById('category-filter').value,
            limit: 20,
            offset: 0
        };

        loadItems(filters);
    }

    // Reset filters
    function resetFilters() {
        document.getElementById('status-filter').value = '';
        document.getElementById('category-filter').value = '';
        loadItems();
    }

    // Event listeners
    applyFiltersBtn.addEventListener('click', applyFilters);
    resetFiltersBtn.addEventListener('click', resetFilters);

    // Load initial data
    loadItems();
});
</script>
{{end}}
