{{template "base.html" .}}

{{define "content"}}
<div class="space-y-8">
    <div class="flex items-center justify-between">
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Search Management</h1>
        <div class="flex space-x-3">
            <button id="refresh-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors flex items-center shadow-sm">
                <svg class="w-4 h-4 mr-2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Refresh
            </button>
            <button id="execute-all-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors flex items-center shadow-sm">
                <svg class="w-4 h-4 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Execute All
            </button>
            <button id="add-search-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 dark:hover:bg-blue-500 transition-colors flex items-center shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Search
            </button>
        </div>
    </div>

    <!-- Search List -->
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-6">Active Searches</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
                <thead>
                    <tr>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50 rounded-tl-lg">Name</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50">Query</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50">Status</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50">Last Checked</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50">Items Found</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50 rounded-tr-lg">Actions</th>
                    </tr>
                </thead>
                <tbody id="searches-table" class="divide-y divide-slate-200 dark:divide-slate-700">
                    <tr>
                        <td colspan="6" class="text-center p-6 text-slate-500 dark:text-slate-400">Loading searches...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Search Details Modal -->
    <div id="search-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 transition-opacity" style="z-index: 1000;">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-xl max-w-2xl w-full border border-slate-200 dark:border-slate-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white" id="modal-title">Search Details</h2>
                <button id="close-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="search-form" class="space-y-5">
                <input type="hidden" id="search-id" name="id">

                <div class="form-group space-y-1.5">
                    <label for="search-name" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Name</label>
                    <input type="text" id="search-name" name="name" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                </div>

                <div class="form-group space-y-1.5">
                    <label for="search-query" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Query</label>
                    <input type="text" id="search-query" name="query" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                </div>

                <div class="form-group space-y-1.5">
                    <label for="search-regex" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Regex Pattern (Optional)</label>
                    <input type="text" id="search-regex" name="regex_pattern" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white font-mono text-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="form-group space-y-1.5">
                        <label for="search-enabled" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Enabled</label>
                        <select id="search-enabled" name="enabled" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>

                    <div class="form-group space-y-1.5">
                        <label for="search-threshold" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Notification Threshold (Days)</label>
                        <input type="number" id="search-threshold" name="notification_threshold_days" min="1" value="1" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="form-group space-y-1.5">
                        <label for="search-min-price" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Min Price</label>
                        <input type="number" id="search-min-price" name="min_price" step="0.01" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                    </div>

                    <div class="form-group space-y-1.5">
                        <label for="search-max-price" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Max Price</label>
                        <input type="number" id="search-max-price" name="max_price" step="0.01" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                    </div>
                </div>

                <div class="form-group space-y-1.5">
                    <label for="search-category" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Category Filter</label>
                    <input type="text" id="search-category" name="category_filter" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                </div>

                <div class="form-group space-y-1.5">
                    <label for="search-seller" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Seller Filter</label>
                    <input type="text" id="search-seller" name="seller_filter" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                </div>

                <div class="form-group space-y-1.5">
                    <label for="search-sort" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Sort By</label>
                    <select id="search-sort" name="sort_by" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                        <option value="ends_soonest">Ends Soonest</option>
                        <option value="newest">Newest</option>
                        <option value="price_low">Price: Low to High</option>
                        <option value="price_high">Price: High to Low</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" id="delete-search-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium text-red-700 bg-red-50 hover:bg-red-100 dark:bg-red-900/30 dark:text-red-400 dark:hover:bg-red-900/50 transition-colors hidden mr-auto">
                        Delete
                    </button>
                    <button type="button" id="cancel-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 dark:hover:bg-blue-500 transition-colors shadow-sm">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const api = new GoodwillAPI();
    let currentSearches = [];
    let currentSearchID = null;

    // DOM elements
    const searchesTable = document.getElementById('searches-table');
    const addSearchBtn = document.getElementById('add-search-btn');
    const refreshBtn = document.getElementById('refresh-btn');
    const executeAllBtn = document.getElementById('execute-all-btn');
    const searchModal = document.getElementById('search-modal');
    const closeModal = document.getElementById('close-modal');
    const cancelBtn = document.getElementById('cancel-btn');
    const searchForm = document.getElementById('search-form');
    const deleteSearchBtn = document.getElementById('delete-search-btn');
    const modalTitle = document.getElementById('modal-title');

    // Load searches
    async function loadSearches() {
        try {
            const response = await api.getSearches();
            currentSearches = response.searches || [];
            renderSearchesTable();
        } catch (error) {
            console.error('Failed to load searches:', error);
            searchesTable.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-danger">Failed to load searches</td></tr>';
        }
    }

    // Render searches table
    function renderSearchesTable() {
        if (currentSearches.length === 0) {
            searchesTable.innerHTML = '<tr><td colspan="6" class="text-center p-4">No searches found</td></tr>';
            return;
        }

        searchesTable.innerHTML = '';
        currentSearches.forEach(search => {
            const row = document.createElement('tr');
            row.className = 'hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors';

            row.innerHTML = `
                <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-slate-900 dark:text-white">${search.name}</td>
                <td class="px-4 py-3 text-sm text-slate-600 dark:text-slate-300 max-w-xs truncate" title="${search.query}">${search.query}</td>
                <td class="px-4 py-3 whitespace-nowrap">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${search.enabled ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400 border border-green-200 dark:border-green-800' : 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800'}">
                        ${search.enabled ? 'Active' : 'Disabled'}
                    </span>
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">${search.last_checked || 'Never'}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-slate-900 dark:text-white font-medium">0</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm space-x-3">
                    <button class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-medium view-search" data-id="${search.id}">View</button>
                    <button class="text-green-600 dark:text-green-400 hover:text-green-800 dark:hover:text-green-300 font-medium execute-search" data-id="${search.id}">Execute</button>
                </td>
            `;

            searchesTable.appendChild(row);
        });

        // Add event listeners to buttons
        document.querySelectorAll('.view-search').forEach(btn => {
            btn.addEventListener('click', () => viewSearch(btn.dataset.id));
        });

        document.querySelectorAll('.execute-search').forEach(btn => {
            btn.addEventListener('click', () => executeSearch(btn.dataset.id));
        });
    }

    // View search details
    async function viewSearch(id) {
        try {
            const search = currentSearches.find(s => s.id == id);
            if (!search) return;

            currentSearchID = id;
            modalTitle.textContent = 'Edit Search';
            deleteSearchBtn.classList.remove('hidden');

            // Populate form
            document.getElementById('search-id').value = search.id;
            document.getElementById('search-name').value = search.name;
            document.getElementById('search-query').value = search.query;
            document.getElementById('search-regex').value = search.regex_pattern || '';
            document.getElementById('search-enabled').value = search.enabled;
            document.getElementById('search-threshold').value = search.notification_threshold_days;
            document.getElementById('search-min-price').value = search.min_price || '';
            document.getElementById('search-max-price').value = search.max_price || '';
            document.getElementById('search-category').value = search.category_filter || '';
            document.getElementById('search-seller').value = search.seller_filter || '';
            document.getElementById('search-sort').value = search.sort_by || 'ends_soonest';

            searchModal.classList.remove('hidden');
        } catch (error) {
            console.error('Failed to view search:', error);
        }
    }

    // Execute search
    async function executeSearch(id) {
        try {
            const response = await api.executeSearch(id);
            showFlashMessage('success', `Search execution queued: ${response.message}`);
        } catch (error) {
            console.error('Failed to execute search:', error);
            showFlashMessage('danger', 'Failed to execute search');
        }
    }

    // Add new search
    function addNewSearch() {
        currentSearchID = null;
        modalTitle.textContent = 'Add New Search';
        deleteSearchBtn.classList.add('hidden');

        // Clear form
        searchForm.reset();
        document.getElementById('search-threshold').value = 1;

        searchModal.classList.remove('hidden');
    }

    // Save search
    async function saveSearch(e) {
        e.preventDefault();

        const formData = new FormData(searchForm);
        const searchData = {
            name: formData.get('name'),
            query: formData.get('query'),
            regex_pattern: formData.get('regex_pattern'),
            enabled: formData.get('enabled') === 'true',
            notification_threshold_days: parseInt(formData.get('notification_threshold_days')) || 1,
            min_price: formData.get('min_price') ? parseFloat(formData.get('min_price')) : null,
            max_price: formData.get('max_price') ? parseFloat(formData.get('max_price')) : null,
            category_filter: formData.get('category_filter'),
            seller_filter: formData.get('seller_filter'),
            shipping_filter: formData.get('shipping_filter'),
            condition_filter: formData.get('condition_filter'),
            sort_by: formData.get('sort_by')
        };

        try {
            if (currentSearchID) {
                // Update existing search
                await api.updateSearch(currentSearchID, searchData);
                showFlashMessage('success', 'Search updated successfully');
            } else {
                // Create new search
                await api.createSearch(searchData);
                showFlashMessage('success', 'Search created successfully');
            }

            // Refresh the list
            await loadSearches();
            searchModal.classList.add('hidden');
        } catch (error) {
            console.error('Failed to save search:', error);
            showFlashMessage('danger', 'Failed to save search');
        }
    }

    // Delete search
    async function deleteSearch() {
        if (!currentSearchID) return;

        if (!confirm('Are you sure you want to delete this search?')) return;

        try {
            await api.deleteSearch(currentSearchID);
            showFlashMessage('success', 'Search deleted successfully');
            searchModal.classList.add('hidden');
            await loadSearches();
        } catch (error) {
            console.error('Failed to delete search:', error);
            showFlashMessage('danger', 'Failed to delete search');
        }
    }

    // Execute all searches
    async function executeAllSearches() {
        if (!confirm('Are you sure you want to execute all active searches?')) return;

        try {
            const activeSearches = currentSearches.filter(s => s.enabled);
            let successCount = 0;

            for (const search of activeSearches) {
                try {
                    await api.executeSearch(search.id);
                    successCount++;
                } catch (error) {
                    console.error(`Failed to execute search ${search.id}:`, error);
                }
            }

            showFlashMessage('success', `Executed ${successCount} of ${activeSearches.length} searches`);
        } catch (error) {
            console.error('Failed to execute searches:', error);
            showFlashMessage('danger', 'Failed to execute searches');
        }
    }

    // Show flash message
    function showFlashMessage(type, message) {
        const flashContainer = document.getElementById('flash-messages');
        const flashMsg = document.createElement('div');
        flashMsg.className = `bg-${type}-100 border border-${type}-400 text-${type}-700 px-4 py-3 rounded`;
        flashMsg.textContent = message;

        flashContainer.appendChild(flashMsg);
        setTimeout(() => flashMsg.remove(), 5000);
    }

    // Event listeners
    addSearchBtn.addEventListener('click', addNewSearch);
    refreshBtn.addEventListener('click', loadSearches);
    executeAllBtn.addEventListener('click', executeAllSearches);
    closeModal.addEventListener('click', () => searchModal.classList.add('hidden'));
    cancelBtn.addEventListener('click', () => searchModal.classList.add('hidden'));
    searchForm.addEventListener('submit', saveSearch);
    deleteSearchBtn.addEventListener('click', deleteSearch);

    // Close modal when clicking outside
    searchModal.addEventListener('click', (e) => {
        if (e.target === searchModal) {
            searchModal.classList.add('hidden');
        }
    });

    // Load initial data
    loadSearches();
});
</script>
{{end}}
