{{template "base.html" .}}

{{define "content"}}
<div class="flex items-center justify-center min-h-[calc(100vh-4rem)]">
    <div class="bg-white dark:bg-slate-800 p-10 rounded-2xl shadow-xl max-w-md w-full border border-slate-200 dark:border-slate-700">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 shadow-inner mb-6">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">go-find-goodwill</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2">Please sign in to continue</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div class="form-group space-y-1.5">
                <label for="username" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Username</label>
                <input type="text" id="username" name="username" required class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
            </div>

            <div class="form-group space-y-1.5">
                <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
            </div>

            <div class="flex items-center justify-between pt-1">
                <div class="flex items-center">
                    <input type="checkbox" id="remember-me" name="remember_me" class="w-4 h-4 text-blue-600 bg-slate-100 border-slate-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-slate-800 focus:ring-2 dark:bg-slate-700 dark:border-slate-600">
                    <label for="remember-me" class="ml-2 text-sm font-medium text-slate-600 dark:text-slate-400 cursor-pointer">Remember me</label>
                </div>
                <a href="#" class="text-sm font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300 transition-colors">Forgot password?</a>
            </div>

            <button type="submit" class="w-full px-4 py-3 text-sm font-semibold rounded-xl text-white bg-blue-600 hover:bg-blue-700 shadow-sm hover:shadow transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-slate-900 flex justify-center items-center">
                Sign In
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-slate-500 dark:text-slate-400">
            <p>&copy; 2023 go-find-goodwill. All rights reserved.</p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('login-form');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = new FormData(loginForm);
        const username = formData.get('username');
        const password = formData.get('password');
        const remember = formData.get('remember_me') === 'on';

        try {
            // In a real app, this would call the login API
            // For now, we'll just redirect to dashboard
            console.log('Login attempt:', {username, password, remember});

            // Show loading state
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Signing In...';

            // Simulate API call delay
            await new Promise(resolve => setTimeout(resolve, 1000));

            // Redirect to dashboard
            window.location.href = '/dashboard';

        } catch (error) {
            console.error('Login failed:', error);
            showFlashMessage('danger', 'Invalid username or password');
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    });

    function showFlashMessage(type, message) {
        const flashContainer = document.getElementById('flash-messages');
        const flashMsg = document.createElement('div');
        flashMsg.className = `bg-${type}-50 border border-${type}-200 text-${type}-700 px-5 py-4 rounded-xl shadow-lg transition-transform duration-300 transform translate-y-0 relative`;
        flashMsg.role = "alert";
        flashMsg.innerHTML = `<span class="block sm:inline">${message}</span>`;

        flashContainer.appendChild(flashMsg);
        setTimeout(() => {
            flashMsg.style.opacity = '0';
            flashMsg.style.transition = 'opacity 0.5s ease-out';
            setTimeout(() => {
                flashMsg.remove();
            }, 500);
        }, 5000);
    }
});
</script>
{{end}}
