<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>go-find-goodwill - {{.Title}}</title>
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <script src="/static/js/tailwind.js"></script>
    <script defer src="/static/js/alpine.js"></script>
    <script defer src="/static/js/api.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-800 min-h-screen text-slate-900 dark:text-white antialiased">
    <div class="min-h-screen flex flex-col">
        <!-- Top Navigation -->
        <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400 tracking-tight">go-find-goodwill</h1>
                        </div>
                        <nav class="ml-10 flex items-center space-x-6">
                            <a href="/dashboard" class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400 font-medium transition-colors">Dashboard</a>
                            <a href="/searches" class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400 font-medium transition-colors">Searches</a>
                            <a href="/items" class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400 font-medium transition-colors">Items</a>
                            <a href="/notifications" class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400 font-medium transition-colors">Notifications</a>
                            <a href="/settings" class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400 font-medium transition-colors">Settings</a>
                        </nav>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
            {{template "content" .}}
        </main>
    </div>

    <!-- Flash Messages -->
    <div id="flash-messages" class="fixed top-20 right-4 space-y-3 z-50">
        {{range .FlashMessages}}
        <div class="bg-{{.Type}}-50 border border-{{.Type}}-200 text-{{.Type}}-700 px-5 py-4 rounded-xl shadow-lg transition-transform duration-300 transform translate-y-0 relative" role="alert">
            <span class="block sm:inline">{{.Message}}</span>
        </div>
        {{end}}
    </div>

    <script>
        // Auto-dismiss flash messages
        setTimeout(() => {
            const el = document.getElementById('flash-messages');
            if (el) {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.5s ease-out';
                setTimeout(() => {
                    el.style.display = 'none';
                }, 500);
            }
        }, 5000);
    </script>
</body>
</html>
