{{template "base.html" .}}

{{define "content"}}
<div class="space-y-8">
    <div class="flex items-center justify-between">
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Notification Center</h1>
        <div class="flex space-x-3">
            <button id="refresh-notifications" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors flex items-center shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Refresh
            </button>
            <button id="test-notification" class="px-5 py-2.5 rounded-xl text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 dark:hover:bg-blue-500 transition-colors flex items-center shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                Test Notification
            </button>
        </div>
    </div>

    <!-- Notification List -->
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-6">Recent Notifications</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
                <thead>
                    <tr>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50 rounded-tl-lg">Type</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50">Status</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50">Item</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50">Search</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-slate-50 dark:bg-slate-800/50 rounded-tr-lg">Created At</th>
                    </tr>
                </thead>
                <tbody id="notifications-table" class="divide-y divide-slate-200 dark:divide-slate-700">
                    <tr>
                        <td colspan="5" class="text-center p-6 text-slate-500 dark:text-slate-400">Loading notifications...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Test Notification Modal -->
    <div id="test-notification-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 transition-opacity" style="z-index: 1000;">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-xl max-w-md w-full border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white">Test Notification</h2>
                <button id="close-test-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="test-notification-form" class="space-y-5">
                <div class="form-group space-y-1.5">
                    <label for="notification-type" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Notification Type</label>
                    <select id="notification-type" name="type" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                        <option value="item_found">Item Found</option>
                        <option value="price_drop">Price Drop</option>
                        <option value="auction_ending">Auction Ending</option>
                    </select>
                </div>

                <div class="form-group space-y-1.5">
                    <label for="notification-recipient" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Recipient Email</label>
                    <input type="email" id="notification-recipient" name="recipient" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                </div>

                <div class="form-group space-y-1.5">
                    <label for="notification-item" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Item ID (Optional)</label>
                    <input type="number" id="notification-item" name="item_id" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                </div>

                <div class="form-group space-y-1.5">
                    <label for="notification-search" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Search ID (Optional)</label>
                    <input type="number" id="notification-search" name="search_id" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-900 dark:text-white">
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" id="cancel-test-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 dark:hover:bg-blue-500 transition-colors shadow-sm">
                        Send Test
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const api = new GoodwillAPI();
    const notificationsTable = document.getElementById('notifications-table');
    const refreshBtn = document.getElementById('refresh-notifications');
    const testBtn = document.getElementById('test-notification');
    const testModal = document.getElementById('test-notification-modal');
    const closeTestModal = document.getElementById('close-test-modal');
    const cancelTestBtn = document.getElementById('cancel-test-btn');
    const testForm = document.getElementById('test-notification-form');

    let currentNotifications = [];

    // Load notifications
    async function loadNotifications() {
        try {
            const response = await api.getNotifications({limit: 20});
            currentNotifications = response.notifications || [];
            renderNotificationsTable();
        } catch (error) {
            console.error('Failed to load notifications:', error);
            notificationsTable.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-danger">Failed to load notifications</td></tr>';
        }
    }

    // Render notifications table
    function renderNotificationsTable() {
        if (currentNotifications.length === 0) {
            notificationsTable.innerHTML = '<tr><td colspan="5" class="text-center p-4">No notifications found</td></tr>';
            return;
        }

        notificationsTable.innerHTML = '';
        currentNotifications.forEach(notification => {
            const row = document.createElement('tr');
            row.className = 'hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors';

            row.innerHTML = `
                <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-slate-900 dark:text-white">${notification.notification_type}</td>
                <td class="px-4 py-3 whitespace-nowrap">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${notification.status === 'sent' ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400 border border-green-200 dark:border-green-800' : notification.status === 'failed' ? 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800' : 'bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-400 border border-amber-200 dark:border-amber-800'}">
                        ${notification.status}
                    </span>
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">${notification.item_id || 'N/A'}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">${notification.search_id || 'N/A'}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">${notification.created_at}</td>
            `;

            notificationsTable.appendChild(row);
        });
    }

    // Show test notification modal
    function showTestModal() {
        testForm.reset();
        testModal.classList.remove('hidden');
    }

    // Send test notification
    async function sendTestNotification(e) {
        e.preventDefault();

        const formData = new FormData(testForm);
        const notificationData = {
            type: formData.get('type'),
            recipient: formData.get('recipient'),
            item_id: formData.get('item_id') || null,
            search_id: formData.get('search_id') || null
        };

        try {
            const response = await api.testNotification(notificationData);
            showFlashMessage('success', `Test notification sent: ${response.message}`);
            testModal.classList.add('hidden');
        } catch (error) {
            console.error('Failed to send test notification:', error);
            showFlashMessage('danger', 'Failed to send test notification');
        }
    }

    // Show flash message
    function showFlashMessage(type, message) {
        const flashContainer = document.getElementById('flash-messages');
        const flashMsg = document.createElement('div');
        flashMsg.className = `bg-${type}-100 border border-${type}-400 text-${type}-700 px-4 py-3 rounded`;
        flashMsg.textContent = message;

        flashContainer.appendChild(flashMsg);
        setTimeout(() => flashMsg.remove(), 5000);
    }

    // Event listeners
    refreshBtn.addEventListener('click', loadNotifications);
    testBtn.addEventListener('click', showTestModal);
    closeTestModal.addEventListener('click', () => testModal.classList.add('hidden'));
    cancelTestBtn.addEventListener('click', () => testModal.classList.add('hidden'));
    testForm.addEventListener('submit', sendTestNotification);

    // Close modal when clicking outside
    testModal.addEventListener('click', (e) => {
        if (e.target === testModal) {
            testModal.classList.add('hidden');
        }
    });

    // Load initial data
    loadNotifications();
});
</script>
{{end}}
